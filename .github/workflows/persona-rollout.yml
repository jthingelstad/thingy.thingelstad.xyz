name: Persona rollout

# A persona change reaches a surface only when someone takes it there. This opens
# the checklist, from kit/surfaces.json, as an issue.
on:
  push:
    branches: [main]
    paths: [persona/THINGY.md]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Open the rollout checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/persona-rollout.mjs "$GITHUB_SHA" > rollout.md
          gh issue create \
            --title "Roll out the persona change ${GITHUB_SHA::7}" \
            --body-file rollout.md
